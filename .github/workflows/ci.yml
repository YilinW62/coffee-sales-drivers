name: tests & pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Regenerate sample data and run the full pipeline
        run: |
          python scripts/generate_sample_data.py --stores 20 --out data/sample_sales.csv
          python run_analysis.py --data data/sample_sales.csv --out reports
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: reports/
